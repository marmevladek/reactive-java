services:
  postgres:
    container_name: postgres_container
    image: postgres:17.2
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../../pharmacy-web-spring/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmacy-web-spring

volumes:
  postgres:
